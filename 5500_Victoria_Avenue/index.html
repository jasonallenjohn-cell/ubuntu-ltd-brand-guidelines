<style>
:root{--espresso:#2E211B;--cream:#F5EEE1;--gold:#C9A227;--rule:#DED3C0;--flag:#9B2C2C;--ok:#2F6B4F}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--espresso);font:400 17px/1.62 Newsreader,Georgia,serif;-webkit-font-smoothing:antialiased}
.gate{min-height:100vh;display:grid;place-items:center;padding:32px}
.card{width:100%;max-width:440px;text-align:center}
.eyebrow{font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:26px}
.card h1{font:400 34px/1.16 Newsreader,serif;margin:0 0 6px}
.card .sub{font-style:italic;color:var(--gold);font-size:20px;margin:0 0 20px}
.card p{color:#6B5B4E;font-size:15px;margin:0 0 26px}
form{display:flex;flex-direction:column;gap:12px}
input{width:100%;padding:13px 16px;border:1px solid var(--rule);border-radius:3px;background:#FBF7EF;font:400 15px 'JetBrains Mono',monospace;color:var(--espresso);letter-spacing:.04em}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.15)}
button{padding:13px 16px;border:0;border-radius:3px;background:var(--espresso);color:var(--cream);font:500 12px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .15s}
button:hover:not(:disabled){background:#433027}
button:disabled{opacity:.45;cursor:default}
.err{color:var(--flag);font-size:14px;min-height:20px;margin:4px 0 0}
.lock{font-size:11px;color:#8B7B6E;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;margin-top:30px;padding-top:18px;border-top:1px solid var(--rule)}
main{display:none;max-width:860px;margin:0 auto;padding:56px 28px 90px}
main.on{display:block;animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
main h1{font:400 46px/1.1 Newsreader,serif;margin:0 0 8px;letter-spacing:-.015em}
main h2{font:400 30px/1.2 Newsreader,serif;margin:56px 0 14px;padding-top:26px;border-top:1px solid var(--rule);letter-spacing:-.01em}
main h3{font:500 21px/1.3 Newsreader,serif;margin:34px 0 10px}
main p{margin:0 0 15px}
main strong{font-weight:600}
main hr{border:0;border-top:1px solid var(--rule);margin:44px 0}
main table{width:100%;border-collapse:collapse;margin:18px 0 26px;font-size:14.5px}
main th{background:var(--espresso);color:var(--cream);font:500 10.5px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;padding:11px 13px;text-align:left}
main th:not(:first-child){text-align:right}
main td{padding:10px 13px;border-bottom:1px solid var(--rule);vertical-align:top}
main td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
main tbody tr:nth-child(even){background:rgba(222,211,192,.22)}
main blockquote{margin:22px 0;padding:16px 20px;background:rgba(201,162,39,.09);border-left:3px solid var(--gold);font-size:15.5px}
main blockquote p{margin:0 0 10px}main blockquote p:last-child{margin:0}
main em{font-style:italic;color:#6B5B4E}
main code{font:400 13.5px 'JetBrains Mono',monospace;background:rgba(222,211,192,.5);padding:1px 5px;border-radius:2px}
@media print{.gate{display:none}main{display:block;padding:0}main h2{page-break-after:avoid}main table{page-break-inside:avoid}}
@media(max-width:640px){main{padding:34px 18px 60px}main h1{font-size:34px}main h2{font-size:25px}main table{font-size:13px}main td,main th{padding:8px 9px}}
</style></head><body>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

/**
 * md-renderer.js — a small CommonMark subset, dependency-free.
 *
 * Deliberately inlined into the protected page rather than pulled from a CDN:
 * a blocked or offline CDN must never be able to masquerade as a wrong password.
 *
 * Supports: ATX headings (h1–h4), pipe tables with a header separator row,
 * blockquotes, unordered lists, horizontal rules, paragraphs, and inline
 * `code`, **bold** and *italic*. That is everything the deal package uses.
 */
function md2html(src) {
  const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = (t) =>
    esc(t)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');

  const L = src.split('\n');
  let out = '', i = 0, para = [], quote = [], list = [];

  const flushP = () => { if (para.length) { out += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  // Join before formatting, not after: emphasis often straddles a wrapped line
  // (`*operating` / `agreement*`) and would otherwise never match.
  const flushQ = () => { if (quote.length) { out += '<blockquote><p>' + inline(quote.join(' ')) + '</p></blockquote>'; quote = []; } };
  const flushL = () => { if (list.length) { out += '<ul>' + list.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul>'; list = []; } };
  const flush = () => { flushP(); flushQ(); flushL(); };

  while (i < L.length) {
    const l = L[i];

    if (/^\s*$/.test(l)) { flush(); i++; continue; }
    if (/^(---|\*\*\*|___)\s*$/.test(l)) { flush(); out += '<hr>'; i++; continue; }

    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flush(); const n = h[1].length; out += `<h${n}>` + inline(h[2]) + `</h${n}>`; i++; continue; }

    if (/^>\s?/.test(l)) { flushP(); flushL(); quote.push(l.replace(/^>\s?/, '')); i++; continue; }
    if (/^[-*]\s+/.test(l)) { flushP(); flushQ(); list.push(l.replace(/^[-*]\s+/, '')); i++; continue; }

    // pipe table: a header row followed by a |---|---| separator
    if (/^\|/.test(l) && i + 1 < L.length && /^\|[\s:|-]+\|?\s*$/.test(L[i + 1])) {
      flush();
      const cells = (r) => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
      const head = cells(l);
      i += 2;
      let t = '<table><thead><tr>' + head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
      while (i < L.length && /^\|/.test(L[i])) {
        t += '<tr>' + cells(L[i]).map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>';
        i++;
      }
      out += t + '</tbody></table>';
      continue;
    }

    para.push(l.trim());
    i++;
  }

  flush();
  return out;
}

/** Strip YAML front matter, returning the document body. */
function stripFrontMatter(md) {
  return md.replace(/^---\n[\s\S]*?\n---\n/, '');
}


const f=document.getElementById('f'),pw=document.getElementById('pw'),b=document.getElementById('b'),e=document.getElementById('e');
f.addEventListener('submit',async ev=>{
  ev.preventDefault(); b.disabled=true; b.textContent='Unlocking…'; e.textContent='';
  let plain;
  try{
    const k=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:u8(P.salt),iterations:P.iterations,hash:'SHA-256'},
      await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']),
      {name:'AES-GCM',length:256},false,['decrypt']);
    plain=new TextDecoder().decode(
      await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},k,u8(P.ciphertext)));
  }catch(_){
    /* AES-GCM authentication failed: wrong password, or the payload was tampered with. */
    e.textContent='That password does not unlock this document.';
    b.disabled=false; b.textContent='Unlock'; pw.select(); return;
  }
  try{
    const d=document.getElementById('doc');
    d.innerHTML=md2html(stripFrontMatter(plain));
    d.classList.add('on');
    document.getElementById('gate').remove();
    document.title="5500 Victoria Avenue";
  }catch(err){
    /* Password was correct; rendering broke. Say so — never blame the password. */
    e.textContent='Unlocked, but the page failed to render: '+err.message;
    b.disabled=false; b.textContent='Unlock';
  }
});
