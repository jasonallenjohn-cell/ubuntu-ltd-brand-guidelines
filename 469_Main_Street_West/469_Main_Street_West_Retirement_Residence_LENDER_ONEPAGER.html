var ITER=250000;
var KEYNAME="cg469_access_pw";
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function unlock(pw){
  var d=b64(PAYLOAD), salt=d.slice(0,16), iv=d.slice(16,28), ct=d.slice(28);
  var enc=new TextEncoder();
  var bk=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  return new TextDecoder().decode(pt);
}
function render(htmlDoc){ document.open(); document.write(htmlDoc); document.close(); }
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var e=document.getElementById('e'), pw=document.getElementById('pw').value; e.textContent='Decrypting\u2026';
  try{
    var htmlDoc=await unlock(pw);
    try{ sessionStorage.setItem(KEYNAME,pw); }catch(_){ }
    render(htmlDoc);
  }catch(err){ e.textContent='Incorrect password. Please try again.'; document.getElementById('pw').value=''; document.getElementById('pw').focus(); }
});
(async function(){
  var pw; try{ pw=sessionStorage.getItem(KEYNAME); }catch(_){ }
  if(!pw) return;
  try{ render(await unlock(pw)); }catch(err){ try{ sessionStorage.removeItem(KEYNAME); }catch(_){ } }
})();
